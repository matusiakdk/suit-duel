<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F9">
<meta name="robots" content="noindex">
<title>Suit Picker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩱</text></svg>">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!--
  ============================================================
  SUIT PICKER — build your suit (straps / top / bottom), cast one vote.
  Logs to the SAME Apps Script endpoint as Suit Duel, but to its own
  "picker" sheet tab. index.html and the Suit Duel backend logic are untouched.
  ============================================================
-->
<style>
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  :root{
    color-scheme:light;
    --bg:#F7F8F9; --card:#FFFFFF; --ink:#1C1D21; --ink2:#6B6F76;
    --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.16); --accent:#0866FF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;touch-action:manipulation}
  body{
    background:
      radial-gradient(640px 420px at 50% -60px, rgba(8,102,255,.05), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; /* everything fits one screen */
  }
  .wrap{
    width:100%;max-width:520px;margin:0 auto;height:100dvh;
    display:flex;flex-direction:column;justify-content:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  }

  .shot{
    width:100%;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(28,29,33,.08);
    display:flex;align-items:center;justify-content:center;max-height:52dvh;transition:max-height .25s ease;
  }
  .shot img{width:100%;height:auto;max-height:52dvh;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;transition:max-height .25s ease}
  body.voted .shot, body.voted .shot img{max-height:40dvh} /* give the end panel room */

  /* three attribute rows */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);touch-action:pan-y;
  }
  .arrow{
    flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:0;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
    transition:background .12s ease,transform .1s ease;
  }
  .arrow:active{transform:scale(.9);background:rgba(0,0,0,.05)}
  .arrow svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .mid{flex:1;min-width:0;text-align:center;line-height:1.15}
  .mid .cat{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  .mid .val{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-top:2px}

  .cta{
    width:100%;padding:15px;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font-family:inherit;font-weight:600;font-size:16px;letter-spacing:-.01em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 30px rgba(8,102,255,.25);
    cursor:pointer;transition:transform .12s ease,filter .15s ease;
  }
  .cta:active{transform:scale(.985)}
  @media (hover:hover){.cta:hover{filter:brightness(1.06)}}

  /* end panel (after the vote) */
  #end[hidden]{display:none}
  .thanks{text-align:center;font-size:18px;font-weight:600;color:var(--ink);padding:10px 0}
  .q{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-align:center;margin-bottom:10px}
  .freq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .freq button{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    padding:10px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);
    cursor:pointer;transition:border-color .15s ease,background .15s ease,color .15s ease;
  }
  .freq button.sel{border-color:var(--accent);background:rgba(8,102,255,.08);color:#0B57D0}
  .emailAsk{margin-top:14px;font-size:13px;color:var(--ink2);text-align:center;line-height:1.45}
  .emailRow{display:flex;gap:8px;margin-top:8px}
  .emailRow input{
    flex:1;min-width:0;font-family:inherit;font-size:15px;color:var(--ink);
    padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);
  }
  .emailRow input::placeholder{color:var(--ink3,#A2A6AD)}
  .emailRow button{
    flex:0 0 auto;font-family:inherit;font-weight:600;font-size:15px;color:#fff;background:var(--accent);
    border:0;border-radius:12px;padding:0 18px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  }
  .emailRow button:active{transform:scale(.985)}
</style>
</head>
<body>
<div class="wrap">
  <div class="shot"><img id="shot" src="picker/s1-0k-h.jpg" alt="" draggable="false"></div>

  <!-- builder (hidden once the vote is cast) -->
  <div id="controls">
    <div class="rows" id="rows">
      <div class="row" data-k="straps">
        <button class="arrow" data-dir="-1" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="mid"><div class="cat">Straps</div><div class="val" id="v-straps"></div></div>
        <button class="arrow" data-dir="1" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="row" data-k="top">
        <button class="arrow" data-dir="-1" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="mid"><div class="cat">Top</div><div class="val" id="v-top"></div></div>
        <button class="arrow" data-dir="1" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="row" data-k="bottom">
        <button class="arrow" data-dir="-1" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="mid"><div class="cat">Bottom</div><div class="val" id="v-bottom"></div></div>
        <button class="arrow" data-dir="1" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <button class="cta" id="thisOne" type="button" style="margin-top:10px">This one</button>
  </div>

  <!-- end panel -->
  <div id="end" hidden>
    <div class="thanks" id="endThanks" hidden></div>
    <div id="endFreq" hidden>
      <div class="q">How often do you swim?</div>
      <div class="freq" id="freqBtns">
        <button type="button" data-f="1-2">1-2</button>
        <button type="button" data-f="3-5">3-5</button>
        <button type="button" data-f="6+">6+ a week</button>
        <button type="button" data-f="coach">I coach</button>
        <button type="button" data-f="none">I don't</button>
      </div>
      <div class="emailAsk">Want a chance to test the sample? Leave your email.</div>
      <div class="emailRow">
        <input id="emailIn" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">
        <button type="button" id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---- entry params (both optional), captured on load ---- */
const QS = new URLSearchParams(location.search);
const SRC = QS.get('src') || '';
const URL_EMAIL = (QS.get('email') || '').trim();
const VID = Math.random().toString(36).slice(2,10); // links the vote row to the later freq/email update
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw6eJeG_DQzB3VR_kbfofl8jccoRD2sCCh9ii2qFxjMdaaW2zR1sYuxcHomWygrHTh/exec";

/* ---- options + human labels ---- */
const OPT = { straps:["s1","s2","s3","s4"], top:["0k","k"], bottom:["h","l","lk"] };
const LABEL = {
  straps:{s1:"Double U", s2:"Single", s3:"Double cross", s4:"Double, knot"},
  top:{"0k":"No cut-out", k:"Side cut-out"},
  bottom:{h:"High leg", l:"Low leg", lk:"Low leg, hip cut-out"}
};
const state = {straps:"s1", top:"0k", bottom:"h"};
let voted = false;

/* ---- preload all 24 so switching never shows a load ---- */
for(const a of OPT.straps) for(const b of OPT.top) for(const c of OPT.bottom){
  const im = new Image(); im.src = `picker/${a}-${b}-${c}.jpg`;
}

/* ---- unload-safe fire-and-forget POST (same pattern as Suit Duel) ---- */
function post(payload){
  const body = JSON.stringify(payload);
  try{
    let sent=false;
    if(navigator.sendBeacon){ try{ sent=navigator.sendBeacon(SCRIPT_URL, body); }catch(e){} }
    if(!sent) fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",keepalive:true,body:body}).catch(()=>{});
  }catch(e){}
}

const shot = document.getElementById('shot');
function render(){
  document.getElementById('v-straps').textContent = LABEL.straps[state.straps];
  document.getElementById('v-top').textContent    = LABEL.top[state.top];
  document.getElementById('v-bottom').textContent = LABEL.bottom[state.bottom];
  shot.src = `picker/${state.straps}-${state.top}-${state.bottom}.jpg`; // cached -> instant
}
function cycle(k, dir){
  if(voted) return;
  const arr = OPT[k]; const i = arr.indexOf(state[k]);
  state[k] = arr[(i + dir + arr.length) % arr.length];
  render();
}

/* arrow taps */
document.getElementById('rows').addEventListener('click', e=>{
  const btn = e.target.closest('.arrow'); if(!btn) return;
  cycle(btn.closest('.row').dataset.k, +btn.dataset.dir);
});
/* horizontal swipe on a row = that row's arrow (swipe left = next) */
document.querySelectorAll('.row').forEach(row=>{
  let x0=null, y0=null;
  row.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  row.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) cycle(row.dataset.k, dx<0?1:-1);
    x0=y0=null;
  }, {passive:true});
});

/* ---- "This one": cast the vote immediately, then show the end screen ---- */
document.getElementById('thisOne').addEventListener('click', ()=>{
  if(voted) return; voted=true;
  // vote row — code values, not labels
  post({sheet:"picker", type:"vote", straps:state.straps, top:state.top, bottom:state.bottom,
        src:SRC, email:URL_EMAIL, frequency:"", vid:VID});
  document.getElementById('controls').hidden = true; // one vote per session
  document.body.classList.add('voted');
  const end = document.getElementById('end'); end.hidden = false;
  if(URL_EMAIL){
    // email already known -> short thank-you only
    const t = document.getElementById('endThanks');
    t.textContent = "Thanks. Result in the next update.";
    t.hidden = false;
  }else{
    document.getElementById('endFreq').hidden = false;
  }
});

/* frequency buttons — each tap saves to the SAME row straight away */
document.getElementById('freqBtns').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  [...btn.parentNode.children].forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  post({sheet:"picker", type:"update", vid:VID, frequency:btn.dataset.f});
});

/* optional email + Send -> update the same row, then final thanks */
document.getElementById('sendBtn').addEventListener('click', ()=>{
  const email = document.getElementById('emailIn').value.trim();
  if(email) post({sheet:"picker", type:"update", vid:VID, email:email});
  document.getElementById('endFreq').hidden = true;
  const t = document.getElementById('endThanks');
  t.textContent = "Thanks.";
  t.hidden = false;
});

render();
</script>
</body>
</html>
