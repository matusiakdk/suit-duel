<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F9">
<meta name="robots" content="noindex">
<title>Suit Picker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩱</text></svg>">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!--
  ============================================================
  SUIT PICKER — build your suit (straps / top / bottom) as tiles, cast one vote.
  Logs to the SAME Apps Script endpoint as Suit Duel, its own "picker" tab.
  index.html and the Suit Duel backend logic are untouched.
  ============================================================
-->
<style>
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  :root{
    color-scheme:light;
    --bg:#F7F8F9; --card:#FFFFFF; --ink:#1C1D21; --ink2:#6B6F76; --ink3:#A2A6AD;
    --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.16); --accent:#0866FF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;touch-action:manipulation}
  body{
    background:
      radial-gradient(640px 420px at 50% -60px, rgba(8,102,255,.05), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; /* phone: one screen, no scroll */
  }
  .wrap{
    width:100%;max-width:520px;margin:0 auto;height:100dvh;
    display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));
  }

  .head{margin-bottom:0}
  .head h1{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
  .head .sub{font-size:13px;line-height:1.4;color:var(--ink2);margin-top:4px}

  .shot{
    width:100%;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(28,29,33,.08);
    display:flex;align-items:center;justify-content:center;max-height:44dvh;transition:max-height .25s ease;
  }
  .shot img{width:100%;height:auto;max-height:44dvh;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;transition:max-height .25s ease}
  body.voted .shot, body.voted .shot img{max-height:38dvh}

  /* attribute groups as tiles */
  .groups{display:flex;flex-direction:column;gap:8px}
  .group .glabel{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
  .tiles{display:flex;gap:8px}
  .tiles.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{
    flex:1;min-width:0;min-height:42px;padding:7px 6px;border-radius:11px;
    border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.12;
    cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;
    transition:background .12s ease,color .12s ease,border-color .12s ease,transform .1s ease;
  }
  .tile:active{transform:scale(.97)}
  .tile.active{background:#111;color:#fff;border-color:#111}

  .cta{
    width:100%;padding:14px;border:0;border-radius:12px;
    background:#111;color:#fff;font-family:inherit;font-weight:600;font-size:16px;letter-spacing:-.01em;
    box-shadow:0 1px 2px rgba(0,0,0,.12);
    cursor:pointer;transition:transform .12s ease,filter .15s ease;margin-top:4px;
  }
  .cta:active{transform:scale(.985)}
  @media (hover:hover){.cta:hover{filter:brightness(1.3)}}

  /* end panel */
  #end[hidden]{display:none}
  .thanks{text-align:center;font-size:18px;font-weight:600;color:var(--ink);padding:10px 0}
  .q{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-align:center;margin-bottom:10px}
  .freq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .freq button{
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    padding:10px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);
    cursor:pointer;transition:border-color .15s ease,background .15s ease,color .15s ease;
  }
  .freq button.sel{border-color:#111;background:#111;color:#fff}
  .emailAsk{margin-top:14px;font-size:13px;color:var(--ink2);text-align:center;line-height:1.45}
  .emailRow{display:flex;gap:8px;margin-top:8px}
  .emailRow input{
    flex:1;min-width:0;font-family:inherit;font-size:15px;color:var(--ink);
    padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);
  }
  .emailRow input::placeholder{color:var(--ink3)}
  .emailRow button{
    flex:0 0 auto;font-family:inherit;font-weight:600;font-size:15px;color:#fff;background:#111;
    border:0;border-radius:12px;padding:0 18px;cursor:pointer;
  }
  .emailRow button:active{transform:scale(.985)}

  /* desktop: image >= 60% of window height; rest in a column as wide as the image */
  @media (min-width:700px){
    html,body{overflow:auto} /* keep the big image; scroll if the window is short (phone stays no-scroll) */
    .wrap{
      width:min(109vh, 92vw);max-width:none;height:auto;min-height:100dvh;
      justify-content:flex-start;gap:14px;padding:28px 0;
    }
    .shot,.shot img,body.voted .shot,body.voted .shot img{max-height:none}
    .shot img{width:100%;height:auto} /* height = width / 1.79 ≈ 60vh when width = 109vh */
    .head h1{font-size:24px}
    .head .sub{font-size:15px}
    .tile{min-height:48px;font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Build the suit you'd train in.</h1>
    <p class="sub">Pick straps, top and bottom. Then choose the one you'd actually wear twice a day.</p>
  </div>
  <div class="shot"><img id="shot" src="picker/s1-0k-h.jpg" alt="" draggable="false"></div>

  <!-- builder (hidden once the vote is cast) -->
  <div id="controls">
    <div class="groups">
      <div class="group" data-k="straps">
        <div class="glabel">Straps</div>
        <div class="tiles grid2">
          <button class="tile" type="button" data-v="s1">Double U</button>
          <button class="tile" type="button" data-v="s2">Single</button>
          <button class="tile" type="button" data-v="s3">Double cross</button>
          <button class="tile" type="button" data-v="s4">Double, knot</button>
        </div>
      </div>
      <div class="group" data-k="top">
        <div class="glabel">Top</div>
        <div class="tiles">
          <button class="tile" type="button" data-v="0k">No cut-out</button>
          <button class="tile" type="button" data-v="k">Side cut-out</button>
        </div>
      </div>
      <div class="group" data-k="bottom">
        <div class="glabel">Bottom</div>
        <div class="tiles">
          <button class="tile" type="button" data-v="h">High leg</button>
          <button class="tile" type="button" data-v="l">Low leg</button>
          <button class="tile" type="button" data-v="lk">Low leg + hip cut-out</button>
        </div>
      </div>
    </div>
    <button class="cta" id="thisOne" type="button">This one</button>
  </div>

  <!-- end panel -->
  <div id="end" hidden>
    <div class="thanks" id="endThanks" hidden></div>
    <div id="endFreq" hidden>
      <div class="q">How often do you swim?</div>
      <div class="freq" id="freqBtns">
        <button type="button" data-f="1-2">1-2</button>
        <button type="button" data-f="3-5">3-5</button>
        <button type="button" data-f="6+">6+ a week</button>
        <button type="button" data-f="coach">I coach</button>
        <button type="button" data-f="none">I don't</button>
      </div>
      <div class="emailAsk">Want a chance to test the sample? Leave your email.</div>
      <div class="emailRow">
        <input id="emailIn" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">
        <button type="button" id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---- entry params (both optional), captured on load ---- */
const QS = new URLSearchParams(location.search);
const SRC = QS.get('src') || '';
const URL_EMAIL = (QS.get('email') || '').trim();
const VID = Math.random().toString(36).slice(2,10); // links the vote row to the later freq/email update
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw6eJeG_DQzB3VR_kbfofl8jccoRD2sCCh9ii2qFxjMdaaW2zR1sYuxcHomWygrHTh/exec";

/* ---- options + human labels ---- */
const OPT = { straps:["s1","s2","s3","s4"], top:["0k","k"], bottom:["h","l","lk"] };
const LABEL = {
  straps:{s1:"Double U", s2:"Single", s3:"Double cross", s4:"Double, knot"},
  top:{"0k":"No cut-out", k:"Side cut-out"},
  bottom:{h:"High leg", l:"Low leg", lk:"Low leg + hip cut-out"}
};

/* ---- random starting combination (logged as `start`) ---- */
const rand = a => a[Math.floor(Math.random()*a.length)];
const state = {straps:rand(OPT.straps), top:rand(OPT.top), bottom:rand(OPT.bottom)};
const START = `${state.straps}-${state.top}-${state.bottom}`; // code, e.g. s3-k-l
let voted = false;

/* ---- preload all 24 so switching never shows a load ---- */
for(const a of OPT.straps) for(const b of OPT.top) for(const c of OPT.bottom){
  const im = new Image(); im.src = `picker/${a}-${b}-${c}.jpg`;
}

/* ---- unload-safe fire-and-forget POST (same pattern as Suit Duel) ---- */
function post(payload){
  const body = JSON.stringify(payload);
  try{
    let sent=false;
    if(navigator.sendBeacon){ try{ sent=navigator.sendBeacon(SCRIPT_URL, body); }catch(e){} }
    if(!sent) fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",keepalive:true,body:body}).catch(()=>{});
  }catch(e){}
}

const shot = document.getElementById('shot');
function render(){
  document.querySelectorAll('.group').forEach(g=>{
    const k=g.dataset.k;
    g.querySelectorAll('.tile').forEach(t=>t.classList.toggle('active', t.dataset.v===state[k]));
  });
  shot.src = `picker/${state.straps}-${state.top}-${state.bottom}.jpg`; // cached -> instant
}

/* tile taps set that attribute and swap the image */
document.querySelectorAll('.group .tiles').forEach(tiles=>{
  tiles.addEventListener('click', e=>{
    const t = e.target.closest('.tile'); if(!t || voted) return;
    state[tiles.closest('.group').dataset.k] = t.dataset.v;
    render();
  });
});

/* ---- "This one": cast the vote immediately, then show the end screen ---- */
document.getElementById('thisOne').addEventListener('click', ()=>{
  if(voted) return; voted=true;
  // code values, not labels; `start` = the random initial combination
  post({sheet:"picker", type:"vote", straps:state.straps, top:state.top, bottom:state.bottom,
        src:SRC, email:URL_EMAIL, frequency:"", vid:VID, start:START});
  document.getElementById('controls').hidden = true; // one vote per session
  document.body.classList.add('voted');
  document.getElementById('end').hidden = false;
  if(URL_EMAIL){
    const t = document.getElementById('endThanks');
    t.textContent = "Thanks. Result in the next update.";
    t.hidden = false;
  }else{
    document.getElementById('endFreq').hidden = false;
  }
});

/* frequency buttons — each tap saves to the SAME row straight away */
document.getElementById('freqBtns').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  [...btn.parentNode.children].forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  post({sheet:"picker", type:"update", vid:VID, frequency:btn.dataset.f});
});

/* optional email + Send -> update the same row, then final thanks */
document.getElementById('sendBtn').addEventListener('click', ()=>{
  const email = document.getElementById('emailIn').value.trim();
  if(email) post({sheet:"picker", type:"update", vid:VID, email:email});
  document.getElementById('endFreq').hidden = true;
  const t = document.getElementById('endThanks');
  t.textContent = "Thanks.";
  t.hidden = false;
});

render();
</script>
</body>
</html>
