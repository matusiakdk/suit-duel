<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F8F9">
<meta name="robots" content="noindex">
<title>Suit Picker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩱</text></svg>">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!--
  ============================================================
  SUIT PICKER — standalone skeleton page (no logic, no logging).
  Shows one suit image + three empty rows (Straps / Top / Bottom).
  Shares the look of index.html; does not touch it or the backend.
  ============================================================
-->
<style>
  /* Inter self-hosted — identical to index.html (no third-party requests) */
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  :root{
    color-scheme:light;
    --bg:#F7F8F9;
    --card:#FFFFFF;
    --ink:#1C1D21;
    --ink2:#6B6F76;
    --line:rgba(0,0,0,.08);
    --line-strong:rgba(0,0,0,.16);
    --accent:#0866FF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    background:
      radial-gradient(640px 420px at 50% -60px, rgba(8,102,255,.05), transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;overflow-x:hidden;
  }
  .wrap{
    width:100%;max-width:520px;display:flex;flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
  }

  /* the suit image — full phone width, centered */
  .shot{
    width:100%;border-radius:16px;overflow:hidden;background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(28,29,33,.08);
  }
  .shot img{display:block;width:100%;height:auto}

  /* three empty labelled rows */
  .rows{margin-top:20px;display:flex;flex-direction:column;gap:16px}
  .row .rowLabel{
    font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink2);margin-bottom:8px;
  }
  .row .rowBody{
    min-height:56px;border-radius:12px;
    border:1px dashed var(--line-strong);background:var(--card);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="shot">
    <img src="picker/s1-0k-h.png" alt="">
  </div>
  <div class="rows">
    <div class="row"><div class="rowLabel">Straps</div><div class="rowBody"></div></div>
    <div class="row"><div class="rowLabel">Top</div><div class="rowBody"></div></div>
    <div class="row"><div class="rowLabel">Bottom</div><div class="rowBody"></div></div>
  </div>
</div>
</body>
</html>
