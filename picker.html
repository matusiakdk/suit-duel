<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D0CAC6">
<meta name="robots" content="noindex">
<title>Suit Picker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩱</text></svg>">
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<!--
  ============================================================
  SUIT PICKER — build your suit (straps / top / bottom) as chips, cast one vote.
  Page background = the photo's studio colour, so the model floats seamlessly.
  Logs to the SAME Apps Script endpoint as Suit Duel, its own "picker" tab.
  index.html and the Suit Duel backend logic are untouched.
  ============================================================
-->
<style>
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  :root{
    color-scheme:light;
    --bg:#D0CAC6;           /* sampled from the photo's studio background */
    --ink:#14130F;          /* near-black, warm — reads crisp on the greige */
    --ink2:rgba(20,19,15,.66); /* secondary text, legible on greige (WCAG ~4.5:1) */
    --chip:rgba(20,19,15,.74); /* unselected chip text — clearly readable */
    --chip-line:rgba(20,19,15,.28);
    --chip-line-hover:rgba(20,19,15,.52);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;touch-action:manipulation}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden; /* phone: one screen, no scroll */
  }
  .wrap{
    width:100%;height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;
    padding:calc(10px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));
  }

  /* photo — no card, no shadow, no border; gentle rounding; blends into the page */
  .shot{display:flex;align-items:center;justify-content:center}
  .shot img{
    width:100%;height:auto;max-height:42dvh;object-fit:contain;display:block;border-radius:12px;
    user-select:none;-webkit-user-drag:none;transition:max-height .25s ease;
  }
  body.voted .shot img{max-height:36dvh}

  .side{display:flex;flex-direction:column}
  .head h1{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
  .head .sub{
    font-size:14px;line-height:1.4;color:var(--ink2);margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; /* max 2 lines */
  }

  /* attribute groups as wrapping chips */
  .group{margin-top:20px}
  .group .glabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    height:36px;padding:0 14px;border-radius:999px;
    background:rgba(255,255,255,.42);                 /* frosted fill so each chip reads as a button */
    border:1px solid var(--chip-line);color:var(--chip);
    box-shadow:0 1px 1.5px rgba(20,19,15,.05);
    font-family:inherit;font-size:14px;font-weight:500;letter-spacing:-.01em;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;
    transition:background .12s ease,border-color .12s ease,color .12s ease,transform .1s ease;
  }
  .chip:active{transform:scale(.97)}
  @media (hover:hover){.chip:hover{background:rgba(255,255,255,.62);border-color:var(--chip-line-hover)}}
  .chip.active{background:rgba(255,255,255,.85);border:1.5px solid #14130F;color:#14130F;font-weight:600;box-shadow:0 1px 2px rgba(20,19,15,.1)}

  /* the only filled element */
  .cta{
    margin-top:28px;width:100%;height:48px;border:0;border-radius:999px;
    background:#14130F;color:#fff;font-family:inherit;font-weight:600;font-size:16px;letter-spacing:-.01em;
    cursor:pointer;transition:transform .12s ease,filter .15s ease;
  }
  .cta:active{transform:scale(.985)}
  @media (hover:hover){.cta:hover{filter:brightness(1.3)}}

  /* end panel — lives in the control column; photo stays visible */
  #end[hidden]{display:none}
  #end{margin-top:22px}
  .thanks{font-size:17px;font-weight:600;color:var(--ink);line-height:1.35}
  .q{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:10px}
  .freq{display:flex;flex-wrap:wrap;gap:8px}
  .freq button{
    height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.42);
    border:1px solid var(--chip-line);color:var(--chip);box-shadow:0 1px 1.5px rgba(20,19,15,.05);
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  @media (hover:hover){.freq button:hover{background:rgba(255,255,255,.62);border-color:var(--chip-line-hover)}}
  .freq button.sel{background:rgba(255,255,255,.85);border:1.5px solid #14130F;color:#14130F;font-weight:600}
  .emailAsk{margin-top:16px;font-size:13px;color:var(--ink2);line-height:1.45}
  .emailRow{display:flex;gap:8px;margin-top:8px}
  .emailRow input{
    flex:1;min-width:0;font-family:inherit;font-size:15px;color:var(--ink);height:44px;
    padding:0 14px;border-radius:12px;border:1px solid var(--chip-line);background:rgba(255,255,255,.4);
  }
  .emailRow input::placeholder{color:rgba(0,0,0,.4)}
  .emailRow button{
    flex:0 0 auto;font-family:inherit;font-weight:600;font-size:15px;color:#fff;background:#14130F;
    border:0;border-radius:12px;padding:0 18px;cursor:pointer;height:44px;
  }
  .emailRow button:active{transform:scale(.985)}
  #emailBlock[hidden]{display:none}
  .emailRow input.invalid{border-color:#C0392B;box-shadow:0 0 0 2px rgba(192,57,43,.18)}

  /* phone: tighten so the shortest phones (iPhone SE) still fit with no scroll */
  @media (max-width:799px){
    .group{margin-top:16px}
    .cta{margin-top:20px}
    .shot img{max-height:40dvh}
  }

  /* desktop: two columns — photo left (up to 80% window height, as large as fits
     without pushing the control column off-screen), fixed 340px column right, centred */
  @media (min-width:800px){
    html,body{overflow:auto}
    .wrap{
      flex-direction:row;align-items:center;justify-content:center;gap:48px;
      height:auto;min-height:100dvh;padding:32px;
    }
    .shot{flex:0 1 auto;min-width:0}
    .shot img{max-height:80vh;max-width:calc(100vw - 452px);width:auto;height:auto} /* 340 col + 48 gap + 64 padding */
    .side{flex:0 0 340px;width:340px}
    .head{margin-bottom:4px}
    .group:first-child{margin-top:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="shot"><img id="shot" src="picker/s1-0k-h.jpg" alt="" draggable="false"></div>

  <div class="side">
    <div class="head">
      <h1>Build the suit you'd train in.</h1>
      <p class="sub">Pick straps, top and bottom. Then choose the one you'd actually wear twice a day.</p>
    </div>

    <!-- builder (hidden once the vote is cast) -->
    <div id="controls">
      <div class="group" data-k="straps">
        <div class="glabel">Straps</div>
        <div class="chips">
          <button class="chip" type="button" data-v="s1">Double U</button>
          <button class="chip" type="button" data-v="s2">Single</button>
          <button class="chip" type="button" data-v="s3">Double cross</button>
          <button class="chip" type="button" data-v="s4">Double, knot</button>
        </div>
      </div>
      <div class="group" data-k="top">
        <div class="glabel">Top</div>
        <div class="chips">
          <button class="chip" type="button" data-v="0k">No cut-out</button>
          <button class="chip" type="button" data-v="k">Side cut-out</button>
        </div>
      </div>
      <div class="group" data-k="bottom">
        <div class="glabel">Bottom</div>
        <div class="chips">
          <button class="chip" type="button" data-v="h">High leg</button>
          <button class="chip" type="button" data-v="l">Low leg</button>
          <button class="chip" type="button" data-v="lk">Low leg + hip cut-out</button>
        </div>
      </div>
      <button class="cta" id="thisOne" type="button">This one</button>
    </div>

    <!-- end panel -->
    <div id="end" hidden>
      <div class="thanks" id="endThanks" hidden></div>
      <div id="endFreq" hidden>
        <div class="q">How often do you swim?</div>
        <div class="freq" id="freqBtns">
          <button type="button" data-f="1-2">1-2</button>
          <button type="button" data-f="3-5">3-5</button>
          <button type="button" data-f="6+">6+ a week</button>
          <button type="button" data-f="coach">I coach</button>
          <button type="button" data-f="none">I don't</button>
        </div>
        <div id="emailBlock">
          <div class="emailAsk">Want a chance to test the sample? Leave your email.</div>
          <div class="emailRow">
            <input id="emailIn" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">
            <button type="button" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---- entry params (both optional), captured on load ---- */
const QS = new URLSearchParams(location.search);
const SRC = QS.get('src') || 'direct';
const URL_EMAIL = (QS.get('email') || '').trim();
const VID = Math.random().toString(36).slice(2,10);
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw6eJeG_DQzB3VR_kbfofl8jccoRD2sCCh9ii2qFxjMdaaW2zR1sYuxcHomWygrHTh/exec";

/* ---- options + human labels ---- */
const OPT = { straps:["s1","s2","s3","s4"], top:["0k","k"], bottom:["h","l","lk"] };
const LABEL = {
  straps:{s1:"Double U", s2:"Single", s3:"Double cross", s4:"Double, knot"},
  top:{"0k":"No cut-out", k:"Side cut-out"},
  bottom:{h:"High leg", l:"Low leg", lk:"Low leg + hip cut-out"}
};

/* ---- random starting combination (logged as `start`) ---- */
const rand = a => a[Math.floor(Math.random()*a.length)];
const state = {straps:rand(OPT.straps), top:rand(OPT.top), bottom:rand(OPT.bottom)};
const START = `${state.straps}-${state.top}-${state.bottom}`; // code, e.g. s3-k-l
let voted = false;

/* ---- preload all 24 so switching never shows a load ---- */
for(const a of OPT.straps) for(const b of OPT.top) for(const c of OPT.bottom){
  const im = new Image(); im.src = `picker/${a}-${b}-${c}.jpg`;
}

/* ---- unload-safe fire-and-forget POST (same pattern as Suit Duel) ---- */
function post(payload){
  const body = JSON.stringify(payload);
  try{
    let sent=false;
    if(navigator.sendBeacon){ try{ sent=navigator.sendBeacon(SCRIPT_URL, body); }catch(e){} }
    if(!sent) fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",keepalive:true,body:body}).catch(()=>{});
  }catch(e){}
}
/* the vote goes out as a fetch; freq/email updates wait for it to finish so they
   land on the same row (queued if the vote request is still in flight) */
let voteDone = Promise.resolve();
function sendVote(payload){
  const body = JSON.stringify(payload);
  voteDone = fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",keepalive:true,body:body}).catch(()=>{});
}
function sendUpdate(payload){ voteDone.then(()=> post(payload)); }
function finishThanks(text){
  document.getElementById('endFreq').hidden = true;
  const t = document.getElementById('endThanks'); t.textContent = text; t.hidden = false;
}

const shot = document.getElementById('shot');
function render(){
  document.querySelectorAll('.group').forEach(g=>{
    const k=g.dataset.k;
    g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.v===state[k]));
  });
  shot.src = `picker/${state.straps}-${state.top}-${state.bottom}.jpg`; // cached -> instant
}

/* chip taps set that attribute and swap the image */
document.querySelectorAll('.group .chips').forEach(chips=>{
  chips.addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c || voted) return;
    state[chips.closest('.group').dataset.k] = c.dataset.v;
    render();
  });
});

/* ---- "This one": cast the vote immediately, then show the end screen ---- */
document.getElementById('thisOne').addEventListener('click', ()=>{
  if(voted) return; voted=true;
  sendVote({sheet:"picker", type:"vote", straps:state.straps, top:state.top, bottom:state.bottom,
            src:SRC, email:URL_EMAIL, frequency:"", vid:VID, start:START});
  try{ localStorage.setItem('picker_voted', VID); }catch(e){} // one vote per person, persisted across refresh
  document.getElementById('controls').hidden = true;
  document.body.classList.add('voted');
  document.getElementById('end').hidden = false;
  document.getElementById('endFreq').hidden = false;              // frequency question: always, for everyone
  if(URL_EMAIL) document.getElementById('emailBlock').hidden = true; // email field only when ?email= is absent
});

/* frequency buttons — each tap saves to the SAME row straight away */
document.getElementById('freqBtns').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  [...btn.parentNode.children].forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  sendUpdate({sheet:"picker", type:"update", vid:VID, frequency:btn.dataset.f});
  if(URL_EMAIL) finishThanks("Thanks. Result in the next update."); // email already known -> done, no Send step
});

/* optional email + Send (only when ?email= is absent) -> update the same row, then thanks */
document.getElementById('sendBtn').addEventListener('click', ()=>{
  const inp = document.getElementById('emailIn'); const email = inp.value.trim();
  if(!/.+@.+\..+/.test(email)){ inp.classList.add('invalid'); return; } // must have @ and a dot after it
  inp.classList.remove('invalid');
  sendUpdate({sheet:"picker", type:"update", vid:VID, email:email});
  finishThanks("Thanks.");
});

render();

/* returning voter: ?reset=1 clears the lock (for testing); otherwise a stored
   picker_voted means this person already voted -> show the thank-you only */
try{ if(QS.get('reset')==='1') localStorage.removeItem('picker_voted'); }catch(e){}
let alreadyVoted=false; try{ alreadyVoted = !!localStorage.getItem('picker_voted'); }catch(e){}
if(alreadyVoted){
  voted = true;
  document.getElementById('controls').hidden = true;
  document.body.classList.add('voted');
  document.getElementById('end').hidden = false;
  document.getElementById('endFreq').hidden = true;
  const t = document.getElementById('endThanks');
  t.textContent = "Thanks. Result in the next update.";
  t.hidden = false;
}
</script>
</body>
</html>
